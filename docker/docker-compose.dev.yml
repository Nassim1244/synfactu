# Development stack. Used by .devcontainer/devcontainer.json, and usable on
# its own: docker compose -f docker/docker-compose.dev.yml up -d
#
# This is NOT an overlay on docker-compose.yml. It is a separate stack with
# its own project name, so its volumes never collide with production's - a
# dev migration must not be able to reach production data.
#
# Adapt every CHANGEME.

name: synfactu-dev

services:
  dev:
    # A plain Node image, not the project's Dockerfile. The production image
    # is non-root, carries no dev dependencies and needs a built application;
    # none of that exists yet at bootstrap, and none of it is wanted here.
    #
    # The tag is written out rather than taken from ${NODE_VERSION}. Every
    # official node: image defines NODE_VERSION in its own environment, so
    # compose run from inside this container interpolates that value and the
    # default never applies - the stack then rebuilds itself on whatever major
    # the running image happens to carry. Nothing ever set the variable
    # deliberately: there is no docker/.env and no env_file here. Change the
    # major by editing this line, and keep it matching ARG NODE_VERSION in
    # docker/Dockerfile.
    image: node:24-bookworm
    working_dir: /workspace
    # VS Code attaches and drives the container. Without something that keeps
    # running it would exit immediately, having nothing to run.
    #
    # This runs as root - there is no "user:" here, and "remoteUser" only
    # applies to the shells VS Code opens - which is what lets it fix the
    # node_modules mount point before anything needs to write there. A named
    # volume inherits the ownership of its mount point on first creation, and
    # the base image has no /workspace/node_modules, so Docker creates it
    # root-owned and "pnpm install" stops at "Failed to write cafs ...
    # Permission denied". docker/Dockerfile chowns /data for the same reason.
    #
    # The ownership test makes it a no-op once the volume is correct, so a
    # populated node_modules is not walked on every start.
    command: >-
      sh -c '
      mkdir -p /workspace/node_modules;
      [ "$$(stat -c %u /workspace/node_modules)" = "$$(id -u node)" ] || chown -R node:node /workspace/node_modules;
      exec sleep infinity
      '

    environment:
      # NODE_ENV is deliberately absent, and there is no narrower place to put
      # it: a value in this block is the container's environment, inherited by
      # every shell VS Code opens and every command an agent runs, and
      # "remoteEnv" in devcontainer.json would be the same leak by another
      # route. Next respects an ambient NODE_ENV and only defaults when it is
      # unset, so pinned to "development" it makes "next build" mix React's
      # development and production builds, and prerendering dies with "Cannot
      # read properties of null (reading 'useContext')". Nothing needs it set
      # here - "next dev" sets development, "next build" and "next start" set
      # production, and Vitest sets test.
      DATABASE_URL: "file:/data/dev.db"

    volumes:
      # The source, bind-mounted so edits are live. Keep the repository off
      # any synced folder - OneDrive, Dropbox, iCloud - or it will sync
      # node_modules, .next and eventually the database file.
      - ..:/workspace:cached

      # node_modules in a named volume, deliberately shadowing the bind mount
      # above. On Docker Desktop, thousands of small files crossing the
      # filesystem translation layer is the difference between a fast install
      # and a painful one. It also keeps the host free of Linux binaries.
      - dev_node_modules:/workspace/node_modules

      # The development database. A named volume, like production: file
      # locking is reliable there on every host, and nothing outside Docker
      # can touch the file.
      - dev_data:/data

    ports:
      # Published to localhost only. Nothing here goes near Caddy.
      - "127.0.0.1:3000:3000"

volumes:
  dev_node_modules:
  dev_data:
